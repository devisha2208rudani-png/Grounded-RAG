[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag"
version = "0.1.0"
description = "A modular, interview-ready Retrieval-Augmented Generation system with hybrid retrieval, reranking, citations, caching, evaluation, and API support."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115.0",
  "openai>=1.40.0",
  "PyMuPDF>=1.24.0",
  "python-dotenv>=1.0.1",
  "sentence-transformers>=3.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

